name: Retrain ML Model

on: [push]

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install mlflow pandas scikit-learn dagshub python-dotenv

      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/rizkyzhang/Superstore_Sales_Predict_Test.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: mlflow run MLProject --env-manager=local

      - name: Upload model artifact
        uses: actions/upload-artifact@v7
        with:
          name: mlflow-model
          path: mlruns/

      - name: Build Docker image
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/rizkyzhang/Superstore_Sales_Predict_Test.mlflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: mlflow models build-docker -m "models:/SuperstoreSalesModel/latest" -n ${{ secrets.DOCKERHUB_USERNAME }}/superstore-sales

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/superstore-sales
